# VibeCraft: the game page at /vibecraft/, its multiplayer relay at /vibecraft/relay
location = /vibecraft { return 301 /vibecraft/; }
location /vibecraft/ {
    alias /var/www/vibecraft/;
    index index.html;
    charset utf-8;
    # The page is one 2 MB file, mostly base64 (the game and the 3D models):
    # compressed it travels as about 0.5 MB.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    # Browsers keep the page but ask each visit whether it changed: an
    # unchanged page costs a quick "not modified", an update shows at once.
    # (`expires epoch` sends Cache-Control: no-cache; unlike add_header it
    # doesn't drop the headers the server block adds.)
    expires epoch;
}
location = /vibecraft/relay {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # the relay limits connections per visitor
    proxy_read_timeout 2m;   # the relay pings every 30 s, so live games never hit this
    proxy_send_timeout 2m;
}
