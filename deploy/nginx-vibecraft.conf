# VibeCraft: the game page at /vibecraft/, its multiplayer relay at /vibecraft/relay
location = /vibecraft { return 301 /vibecraft/; }
location /vibecraft/ {
    alias /var/www/vibecraft/;
    index index.html;
}
location = /vibecraft/relay {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
